  <body>
    <header class="head">
      <div class="head-inner">
        <a class="logo" href="/">Todd Bennison</a>
        <nav class="head-menu" aria-label="Primary">
          <ul class="nav">
            <li><a href="/collection/" aria-current="page">Collection</a></li>
            <li><a href="/essays/">Essays</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="main">
      <article class="article">
        <h1 class="title">Collection</h1>
        <ul class="pieces">
          <li>
            <a class="piece" href="/collection/stone-warriors/">
              <img
                src="/images/collection/stone-warriors.jpg"
                width="1600"
                height="1600"
                alt="Two carved stone warrior figures standing on stone plinths"
              />
              <span class="piece-caption">
                <span class="piece-title">Pair of stone warriors</span>
                <span class="row-meta">Stone</span>
              </span>
            </a>
          </li>
          <li>
            <a class="piece" href="/collection/marble-lamps/">
              <img
                src="/images/collection/marble-lamps.jpg"
                width="1320"
                height="1189"
                alt="Two carved marble column table lamps with cream shades on a timber table"
                loading="lazy"
              />
              <span class="piece-caption">
                <span class="piece-title">Pair of marble column lamps</span>
                <span class="row-meta">Marble</span>
              </span>
            </a>
          </li>
          <li>
            <a class="piece" href="/collection/aces-and-eights/">
              <img
                src="/images/collection/aces-and-eights.jpg"
                width="1052"
                height="1052"
                alt="Aces &amp; Eights poker set in its hardwood and brass cabinet, doors open, chips racked and the card drawer pulled out"
                loading="lazy"
              />
              <span class="piece-caption">
                <span class="piece-title">Aces &amp; Eights poker set</span>
                <span class="row-meta">Hardwood and brass</span>
              </span>
            </a>
          </li>
          <li>
            <a class="piece" href="/collection/guan-yu/">
              <img
                src="/images/collection/guan-yu.jpg"
                width="1600"
                height="1600"
                alt="Glazed ceramic figure of Guan Yu in green robes, holding his guandao, between two painted vases"
                loading="lazy"
              />
              <span class="piece-caption">
                <span class="piece-title">Guan Yu figure</span>
                <span class="row-meta">Glazed ceramic</span>
              </span>
            </a>
          </li>
        </ul>
      </article>
    </main>

    <footer class="foot">
      <div class="foot-inner">
        <p>Todd Bennison © 2026</p>
